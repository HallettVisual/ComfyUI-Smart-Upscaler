name: Publish to Comfy Registry

# Publishes to https://registry.comfy.org, which is where ComfyUI Manager
# installs from. Runs when the version in pyproject.toml changes, so a normal
# code commit does not trigger a publish - bump the version when you want one.
# Can also be run by hand from the Actions tab.
#
# Needs two things set up once:
#   1. PublisherId filled in under [tool.comfy] in pyproject.toml
#   2. a repository secret named REGISTRY_ACCESS_TOKEN holding an API key
#      created at https://registry.comfy.org

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish:
    name: Publish custom node
    runs-on: ubuntu-latest
    # Never publishes from someone else's fork.
    if: github.repository_owner == 'HallettVisual'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
