[project]
name = "comfyui-smart-upscaler"
version = "1.3.0"
description = "Tiled upscaling for ComfyUI that reads the whole image first, then writes a separate accurate prompt for every tile."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["comfyui", "upscaling", "tiled", "prompting", "vision", "z-image"]

[project.urls]
Repository = "https://github.com/HallettVisual/ComfyUI-Smart-Upscaler"
Documentation = "https://github.com/HallettVisual/ComfyUI-Smart-Upscaler/blob/main/README.md"
"Bug Tracker" = "https://github.com/HallettVisual/ComfyUI-Smart-Upscaler/issues"
Homepage = "https://hallett-ai.com"

# Comfy Registry. `version` above is what the registry publishes - bump it every
# time, the registry rejects a version it has already seen.
[tool.comfy]
# Publisher account at https://registry.comfy.org - without it the publish is
# rejected. This is public metadata, not a secret. The API key is a separate
# value and belongs in the REGISTRY_ACCESS_TOKEN repository secret, never here.
PublisherId = "hallettvisual"
DisplayName = "Smart Upscaler - Hallett"
# Optional listing image, max 800x400. A raw.githubusercontent.com URL works.
Icon = ""

[tool.ruff]
line-length = 100
target-version = "py310"
